<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HP-plugg 1,60</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HP-plugg">
<meta name="theme-color" content="#22262E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F8; --sheet:#FFFFFF; --ink:#22262E; --muted:#5E6573; --line:#D9DDE4;
  --verb:#3550C8; --verb-soft:#E3E8FB; --kvant:#1F8A5C; --kvant-soft:#DDF2E8;
  --pencil:#F2C230; --pencil-ink:#3A2E00; --warn:#B4412F;
  --font-h:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-b:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16191F; --sheet:#1F232B; --ink:#E9ECF1; --muted:#9AA2B1; --line:#343A46;
    --verb:#8EA2FF; --verb-soft:#262E52; --kvant:#5FD3A0; --kvant-soft:#173B2C;
    --pencil:#F2C230; --pencil-ink:#2A2100; --warn:#FF8A75; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16191F; --sheet:#1F232B; --ink:#E9ECF1; --muted:#9AA2B1; --line:#343A46;
  --verb:#8EA2FF; --verb-soft:#262E52; --kvant:#5FD3A0; --kvant-soft:#173B2C;
  --pencil:#F2C230; --pencil-ink:#2A2100; --warn:#FF8A75; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
main{max-width:760px;margin:0 auto;padding:20px 16px 150px}
h1,h2,h3{font-family:var(--font-h);line-height:1.15;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700;margin:28px 0 10px}
h3{font-size:1.05rem;font-weight:700}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.pencil{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:4px 12px;font-size:.875rem}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.875rem;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.wk{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-h);font-weight:700;background:var(--sheet);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;white-space:nowrap}
.wk b{background:var(--pencil);color:var(--pencil-ink);border-radius:999px;padding:0 8px}
.sync{font-size:.8rem;color:var(--muted)}

/* goal strip */
.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
.goal>div{background:var(--sheet);padding:12px}
.goal .n{font-family:var(--font-h);font-size:1.6rem;font-weight:800;line-height:1}
.goal .l{font-size:.8rem;color:var(--muted);margin-top:4px}

/* schedule blocks */
.blocks{list-style:none;margin:0;padding:0;border-left:3px solid var(--line);margin-left:6px}
.blk{position:relative;padding:10px 0 14px 18px}
.blk::before{content:"";position:absolute;left:-8.5px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2.5px solid var(--muted)}
.blk.done::before{background:var(--ink);border-color:var(--ink)}
.blk.now::before{background:var(--pencil);border-color:var(--pencil)}
.blk .t{font-family:var(--font-h);font-weight:700;font-variant-numeric:tabular-nums}
.blk .d{color:var(--muted);font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.875rem}
.chip.v{border-color:var(--verb);color:var(--verb)}
.chip.k{border-color:var(--kvant);color:var(--kvant)}
.chip.v:hover{background:var(--verb-soft)} .chip.k:hover{background:var(--kvant-soft)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* bubble budget: the answer sheet */
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 10px}
.brow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.brow:last-child{border-bottom:0}
.bname{font-family:var(--font-h);font-weight:800;font-size:.95rem}
.bname.v{color:var(--verb)} .bname.k{color:var(--kvant)}
.bub{display:flex;flex-wrap:wrap;gap:5px}
.bub i{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);display:block;position:relative;overflow:hidden}
.bub i.f{background:var(--ink);border-color:var(--ink)}
.bub i.h::after{content:"";position:absolute;inset:0;width:50%;background:var(--ink)}
.bub i.x{background:var(--pencil);border-color:var(--pencil)}
.bval{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:10px 0 4px}
.split span{display:block;height:100%}

/* cards */
.flash{background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.flash .w{font-family:var(--font-h);font-size:2rem;font-weight:800;word-break:break-word}
.flash .m{font-size:1.1rem}
.boxes{display:flex;gap:6px;margin:10px 0}
.boxes div{flex:1;background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.boxes b{display:block;font-family:var(--font-h);font-size:1.2rem}

/* tables & lists */
.tbl{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--font-h);font-weight:700;background:var(--paper)}
tr:last-child td{border-bottom:0}
td input{min-width:64px;padding:4px 6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check{appearance:none;width:22px;height:22px;flex:0 0 22px;border:2px solid var(--muted);border-radius:50%;margin:1px 0 0;cursor:pointer;background:var(--sheet)}
.check:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--sheet)}
.period{padding:12px 14px;border-left:4px solid var(--line);margin-bottom:8px;background:var(--sheet);border-radius:0 10px 10px 0}
.period.cur{border-left-color:var(--pencil);box-shadow:0 0 0 1.5px var(--pencil) inset}
.period.past{opacity:.55}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--pencil);color:var(--pencil-ink);margin-left:6px}
.note{border-left:4px solid var(--pencil);padding:8px 12px;background:var(--sheet);border-radius:0 10px 10px 0;margin:12px 0;font-size:.95rem}
.err-bars div{display:grid;grid-template-columns:130px 1fr 30px;gap:8px;align-items:center;margin:4px 0;font-size:.9rem}
.err-bars span.bar{height:10px;border-radius:999px;background:var(--ink)}
.chart{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.chart svg{width:100%;height:auto;display:block}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--paper)}

/* timer + nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.timer{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--pencil);color:var(--pencil-ink);max-width:none}
.timer.on{display:flex}
.timer .clock{font-family:var(--font-h);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer .lbl{flex:1;font-weight:700;line-height:1.2}
.timer .btn{border-color:var(--pencil-ink);color:var(--pencil-ink)}
.timer .btn.primary{background:var(--pencil-ink);color:var(--pencil)}
nav{display:flex;max-width:760px;margin:0 auto}
nav button{flex:1;border:0;background:transparent;padding:10px 2px 12px;font-family:var(--font-h);font-weight:700;font-size:.8rem;color:var(--muted);border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--pencil)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{padding:18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
details summary{cursor:pointer;font-family:var(--font-h);font-weight:700;padding:8px 0}
.mat details{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:8px}
.mat details[open]{padding-bottom:12px}
.mat ul{padding-left:20px;margin:6px 0}
.mat li{margin:3px 0}
.mat a{color:var(--verb);font-weight:700}
.formula{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;font-variant-numeric:tabular-nums}
.formula div{padding:5px 0;border-bottom:1px dashed var(--line)}
.guide{font-size:.9rem;margin-top:6px}
.guide summary{cursor:pointer;font-weight:700;font-size:.875rem;color:var(--muted);padding:2px 0}
.guide p{margin:4px 0}
.drillq{font-family:var(--font-h);font-size:1.6rem;font-weight:800;text-align:center;margin:8px 0 12px}
.right{color:var(--kvant);font-weight:700}.wrong{color:var(--warn);font-weight:700}
@media (max-width:480px){.formula{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){h1{font-size:1.65rem}.goal .n{font-size:1.3rem}.err-bars div{grid-template-columns:110px 1fr 26px}}
</style>
</head>
<body>
<main id="app"></main>
<div class="dock">
  <div class="timer" id="timer">
    <div class="clock" id="clock">00:00</div>
    <div class="lbl" id="tlbl"></div>
    <button class="btn sm" id="tcancel">Avbryt</button>
    <button class="btn sm primary" id="tstop">Spara</button>
  </div>
  <nav id="nav">
    <button data-tab="idag">Idag</button>
    <button data-tab="vecka">Vecka</button>
    <button data-tab="ord">ORD</button>
    <button data-tab="material">Material</button>
    <button data-tab="logg">Logg</button>
    <button data-tab="plan">Plan</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- data ---------- */
const SUBJ = {
  LAS:{l:"LÄS",n:"Svensk läsförståelse",v:1,b:6},
  ELF:{l:"ELF",n:"Engelsk läsförståelse",v:1,b:5},
  ORD:{l:"ORD",n:"Ordförståelse",v:1,b:4.5},
  MEK:{l:"MEK",n:"Meningskomplettering",v:1,b:4},
  XYZ:{l:"XYZ",n:"Matematisk problemlösning",v:0,b:4},
  KVA:{l:"KVA",n:"Kvantitativa jämförelser",v:0,b:2.5},
  NOG:{l:"NOG",n:"Kvantitativa resonemang",v:0,b:2},
  DTK:{l:"DTK",n:"Diagram, tabeller och kartor",v:0,b:2}
};
const ALL = Object.keys(SUBJ), VERB=["LAS","ELF","ORD","MEK"], KV=["XYZ","KVA","NOG","DTK"];
const ERRT = ["Kunskapslucka","Metodval","Feltolkning","Tidsbrist"];
const B = (s,e,m,o,d)=>({s,e,m,o,d});
const SCHED = {
  A:{
    work:"Arbete 06:00–14:30",
    wd:[B("16:00","17:15",75,["LAS","ELF"],"Läsförståelse med frågor"),
        B("17:30","18:30",60,["ORD","MEK"],"Ord, sammanhang, repetition"),
        B("18:45","19:45",60,KV,"Matematik eller DTK"),
        B("19:45","20:15",30,ALL,"Felanalys, repetition och planering")],
    fri:null,
    sat:[B("09:00","10:30",90,["LAS","ELF"],"Läsförståelse"),
         B("10:45","12:00",75,["ORD","MEK"],"ORD-kort och MEK"),
         B("13:00","14:30",90,["XYZ","KVA"],"XYZ och KVA"),
         B("14:45","15:45",60,["NOG","DTK"],"NOG och DTK"),
         B("16:00","17:00",60,ALL,"Felanalys av veckans fel")],
  },
  B:{
    work:"Arbete 14:30–23:00 (fredag 14:30–18:30)",
    wd:[B("08:00","09:30",90,["LAS","ELF"],"Läsförståelse"),
        B("09:45","10:45",60,["ORD","MEK"],"ORD eller MEK"),
        B("11:00","12:15",75,KV,"Matematik, DTK eller felanalys")],
    fri:[B("08:00","09:30",90,["LAS","ELF"],"Läsförståelse"),
         B("09:45","10:45",60,["ORD","MEK"],"ORD eller MEK"),
         B("11:00","12:15",75,KV,"Matematik eller DTK"),
         B("19:30","20:30",60,ALL,"Felanalys")],
    sat:[B("09:00","10:30",90,["LAS","ELF"],"Läsförståelse"),
         B("10:45","12:00",75,["ORD","MEK"],"ORD-kort och MEK"),
         B("13:00","14:30",90,["XYZ","KVA"],"XYZ och KVA"),
         B("14:45","15:45",60,["NOG","DTK"],"NOG och DTK")],
  },
  sun:[B("09:00","10:30",90,["LAS","ELF"],"Läsförståelse eller provpass"),
       B("10:45","12:00",75,["ORD","MEK"],"ORD-repetition"),
       B("13:00","14:15",75,KV,"Matematik"),
       B("14:30","15:30",60,ALL,"Veckosummering och felanalys")]
};
const PERIODS = [
  ["2026-10-19","2026-11-15","Diagnos, matematiska luckor, läsförståelsevana"],
  ["2026-11-16","2026-12-13","Systematiska metoder och språkförståelse"],
  ["2026-12-14","2027-01-10","Hastighet, tidssatta delprov och aktiv repetition"],
  ["2027-01-11","2027-02-07","Gamla prov, felanalys och återträning"],
  ["2027-02-08","2027-03-07","Provpass på tid, förbättra svagaste områden"],
  ["2027-03-08","2027-04-10","Fullskaliga simuleringar, stabilitet, återhämtning"]
];
const FIRSTWEEK = [
  "Gör ett diagnostiskt kvantitativt provpass (55 minuter) och notera delprovsresultat",
  "Gör ett diagnostiskt verbalt provpass (55 minuter) och notera delprovsresultat",
  "Klassificera varje fel: kunskapslucka, metodval, feltolkning eller tidsbrist",
  "Skapa en repetitionslista för matte – bara där fel förekommer",
  "Träna läsförståelse på B2–C1-nivå med frågor och facitförklaring",
  "Starta ORD-kort för aktiv repetition",
  "Summera tid, antal rätt och återkommande fel på söndag"
];
const MATH = ["Potensregler","Rötter","Bråk","Procent","Algebra"];
const LEIT = [0,1,3,7,14,30]; // dagar till nästa repetition per låda 1–5 (index = låda)
const TABS = ["idag","vecka","ord","material","logg","plan"];
const EXAM_DATE = "2027-04-10";

/* provformat: [antal uppgifter, rekommenderad tid i minuter] */
const FORMAT = {ORD:[10,3],LAS:[10,22],MEK:[10,8],ELF:[10,22],XYZ:[12,12],KVA:[10,10],NOG:[6,10],DTK:[12,23]};

/* hur varje pass ska göras, per fas: 0 = bas (okt–dec), 1 = tempo (dec–feb), 2 = prov (feb–april) */
const GUIDE = {
  LAS:["Läs en text utan tidspress och svara. Gå sedan igenom facit och hitta raden i texten som bevisar rätt svar.",
       "Två texter på 11 minuter vardera. Läs frågorna först, sedan texten, och markera där svaren finns.",
       "Hela LÄS-delen ur ett gammalt prov på 22 minuter. Notera vilken frågetyp du missar."],
  ELF:["Läs en engelsk text på B2–C1-nivå och svara på frågor. Slå upp högst fem ord – förstå helheten.",
       "ELF-uppgifter ur gamla prov, cirka två minuter per uppgift inklusive läsning.",
       "Hela ELF-delen på 22 minuter, direkt efter MEK som på provet."],
  ORD:["Förhör ORD-korten och lägg till 15–20 nya ord. Gör 10 ORD-uppgifter ur gamla prov utan tid.",
       "ORD-korten, sedan 20 ORD-uppgifter på 6 minuter. Gissa via ordets delar när du inte kan ordet.",
       "ORD-korten varje dag, högst 15 minuter. Nya ord tas bara från dina egna fel."],
  MEK:["10 MEK-uppgifter utan tid. Läs hela texten först och leta signalord som men, därför och trots.",
       "10 MEK-uppgifter på 8 minuter. Uteslut alternativ via den lättaste luckan först.",
       "MEK inom hela verbala provpass. Gå igenom dina felmönster efteråt."],
  XYZ:["Repetera ett område i mattebladet och gör sedan 10–15 XYZ ur gamla prov utan tid.",
       "12 XYZ-uppgifter på 12 minuter. Pröva svarsalternativen baklänges när det går snabbare.",
       "XYZ inom hela kvantitativa provpass. Lämna en uppgift efter 90 sekunder och kom tillbaka."],
  KVA:["10 KVA-uppgifter utan tid. Testa alltid 0, 1, −1, ett bråk och ett stort tal.",
       "10 KVA-uppgifter på 10 minuter.",
       "KVA inom hela kvantitativa provpass."],
  NOG:["6 NOG-uppgifter utan tid. Pröva påstående (1) ensamt, (2) ensamt och sedan båda tillsammans.",
       "6 NOG-uppgifter på 10 minuter. Räkna inte ut svaret – avgör bara om det går.",
       "NOG inom hela kvantitativa provpass."],
  DTK:["6 DTK-uppgifter utan tid. Läs rubrik, enheter och fotnoter innan du läser frågorna.",
       "12 DTK-uppgifter på 23 minuter.",
       "DTK inom hela kvantitativa provpass."]
};
const FELANALYS = "Öppna Logg och gå igenom dagens fel. Gör om varje uppgift utan facit, skriv en mening om varför du missade och vilken feltyp det var. Nya ord lägger du i ORD-korten.";

/* strategi per delprov */
const DELPROV = {
  ORD:{opt:null,s:["Svara direkt: antingen kan du ordet eller inte. Sparad tid går till LÄS och ELF.","Bryt ner ordet i förled, rot och efterled. Latinska och grekiska delar som bene-, mal-, pro- och kon- ger ofta en ledtråd.","Läs alla fem alternativ innan du väljer – det närmaste i betydelse vinner, inte det som låter likt."],
       f:["Alternativ som hör till samma ämne men betyder något annat.","Ord som låter som uppgiftsordet men inte är synonymer."]},
  LAS:{opt:null,s:["Skumma rubrik och första stycket, läs frågorna och läs sedan texten med frågorna i huvudet.","Rätt svar ska gå att peka ut i texten. Det som bara låter rimligt räcker inte.","Fråga om huvudtanke? Läs inledning och avslutning extra noga."],
       f:["Påståenden som är sanna men inte svarar på frågan.","Starka ord som alltid, aldrig och enbart.","Egen förkunskap som texten inte stöder."]},

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>ymd(new Date());
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function monday(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
const DAYS=["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"];

const hm=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+" h "+r+" min":h+" h"):r+" min"};
const hdec=m=>(m/60).toFixed(1).replace(".",",");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- derived ---------- */
function weekType(d){
  const key=ymd(monday(d));
  if(S.settings.override[key])return S.settings.override[key];
  return isoWeek(d)%2===1?"A":"B";
}
function blocksFor(d){
  const t=weekType(d),dow=d.getDay(),s=SCHED[t];
  if(dow===0)return SCHED.sun;
  if(dow===6)return s.sat;
  if(dow===5&&s.fri)return s.fri;
  return s.wd;
}
function weekMinutes(d){
  const m0=ymd(monday(d)),m1=ymd(addDays(monday(d),6));const out={};ALL.forEach(k=>out[k]=0);
  S.sessions.forEach(x=>{if(x.date>=m0&&x.date<=m1)out[x.subj]=(out[x.subj]||0)+x.min});
  return out;
}
function dayMinutes(ds){return S.sessions.filter(x=>x.date===ds).reduce((a,x)=>a+x.min,0)}
function dueCards(){const t=today();if(S.newDay!==t){S.newDay=t;S.newCount=0}
  const rev=S.cards.filter(c=>c.box>0&&c.due<=t),left=Math.max(0,(S.settings.perDay||20)-(S.newCount||0));
  return rev.concat(S.cards.filter(c=>c.box===0).slice(0,left))}

function bubbles(min,budget){
  const n=budget*2,full=Math.floor(min/30),half=(min%30)>=15;let s="";
  for(let i=0;i<n;i++){s+=`<i class="${i<full?"f":(i===full&&half?"h":"")}"></i>`}
  const extra=full-n; for(let i=0;i<Math.min(extra,4);i++)s+=`<i class="x" title="Över budget"></i>`;
  return s;
}

function chart(){
  const pts=S.results.filter(r=>r.kv!==""||r.ve!=="");
  if(pts.length<1)return `<div class="empty">Diagrammet visas när du fyllt i första resultatet.</div>`;
  const W=600,H=200,p=30,n=S.results.length;
  const x=i=>p+(W-2*p)*(n>1?i/(n-1):0),y=v=>H-p-(H-2*p)*(v/80);
  const line=(key,col)=>{const ps=S.results.map((r,i)=>r[key]===""?null:[x(i),y(+r[key])]).filter(Boolean);
    return ps.length?`<polyline fill="none" stroke="${col}" stroke-width="3" points="${ps.map(q=>q.join(",")).join(" ")}"/>`+ps.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="${col}"/>`).join(""):""};
  let g="";[0,20,40,60,80].forEach(v=>{g+=`<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+4}" font-size="11" fill="var(--muted)">${v}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Antal rätt över tid">${g}${line("ve","var(--verb)")}${line("kv","var(--kvant)")}</svg>
  <p class="small"><span style="color:var(--verb);font-weight:700">● Verbal</span> &nbsp; <span style="color:var(--kvant);font-weight:700">● Kvant</span> &nbsp;<span class="muted">rätt av 80</span></p></div>`;
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  app.innerHTML=({idag:vIdag,vecka:vVecka,ord:vOrd,material:vMaterial,logg:vLogg,plan:vPlan}[tab])();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  renderTimer();
}
function go(t){tab=t;history.replaceState(null,"","#"+t);render();window.scrollTo(0,0)}

/* ---------- timer ---------- */
function renderTimer(){
  const el=document.getElementById("timer");
  if(!S.timer){el.classList.remove("on");return}
  el.classList.add("on");
  const sec=Math.floor((Date.now()-S.timer.start)/1000),pm=S.timer.plan*60;
  document.getElementById("clock").textContent=pad(Math.floor(sec/60))+":"+pad(sec%60);
  document.getElementById("tlbl").textContent=SUBJ[S.timer.subj].l+(sec>=pm?" · passet är slut":" · "+hm(Math.ceil((pm-sec)/60))+" kvar");
  if(sec>=pm&&!S.timer.rang){S.timer.rang=true;save();if(S.settings.sound!==false){beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}toast("Passet är slut – tryck Spara")}
}
setInterval(()=>{if(S.timer)renderTimer()},1000);
function logSession(subj,min,date){S.sessions.push({id:uid(),date:date||today(),subj,min});save()}

/* ---------- events ---------- */
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.tab)});
document.getElementById("tstop").onclick=()=>{
  const t=S.timer;if(!t)return;const min=Math.round((Date.now()-t.start)/60000);
  S.timer=null;
  if(min>=1){logSession(t.subj,min,ymd(new Date(t.start)));toast(hm(min)+" "+SUBJ[t.subj].l+" sparat")}else{save();toast("För kort pass – inget sparat")}
  render();
};
document.getElementById("tcancel").onclick=()=>{S.timer=null;save();render()};

document.getElementById("app").addEventListener("click",e=>{
  const el=e.target.closest("button,input");if(!el)return;const ds=el.dataset;
  if(ds.start){
    if(S.timer){toast("Spara eller avbryt pågående pass först");return}
    ensureAudio();S.timer={subj:ds.start,start:Date.now(),plan:+ds.min};save();render();toast("Timer startad");
  }
  else if(el.id==="mAdd"){const m=+document.getElementById("mMin").value;if(!(m>0)){toast("Ange minuter");return}
    const s=document.getElementById("mSubj").value;logSession(s,m);toast(hm(m)+" "+SUBJ[s].l+" sparat");render()}
  else if(ds.delsess){S.sessions=S.sessions.filter(x=>x.id!==ds.delsess);save();render()}
  else if(ds.wt){const k=ymd(monday(new Date()));if(ds.wt==="reset")delete S.settings.override[k];else S.settings.override[k]=ds.wt;schedView=null;save();render()}
  else if(ds.sv){schedView=ds.sv;render()}
  else if(el.id==="cAdd"){const w=document.getElementById("cw").value.trim(),m=document.getElementById("cm").value.trim();
    if(!w||!m){toast("Fyll i både ord och betydelse");return}
    S.cards.push({id:uid(),w,m,box:1,due:today()});save();render();toast("Ordet är tillagt");document.getElementById("cw").focus()}
  else if(el.id==="startRev"){cardState={q:dueCards().map(c=>c.id).sort(()=>Math.random()-.5),i:0,show:false};render()}
  else if(el.id==="flip"){cardState.show=true;render()}
  else if(ds.ans!==undefined){
    const c=S.cards.find(x=>x.id===cardState.q[cardState.i]);
    if(c&&c.box===0){if(S.newDay!==today()){S.newDay=today();S.newCount=0}S.newCount=(S.newCount||0)+1}
    if(c){if(ds.ans==="1"){c.box=Math.min(5,c.box+1);c.due=ymd(addDays(new Date(),LEIT[c.box]))}
      else{c.box=1;c.due=today();cardState.q.push(c.id)}}
    cardState.i++;cardState.show=false;save();
    if(cardState.i>=cardState.q.length){cardState={q:[],i:0,show:false};toast("Förhöret är klart")}
    render();
  }
  else if(ds.delcard){S.cards=S.cards.filter(x=>x.id!==ds.delcard);save();render()}
  else if(el.id==="eAdd"){const n=document.getElementById("eN").value.trim();
    S.errors.push({id:uid(),date:today(),s:document.getElementById("eS").value,t:document.getElementById("eT").value,n});save();render();toast("Felet är sparat")}
  else if(ds.delerr){S.errors=S.errors.filter(x=>x.id!==ds.delerr);save();render()}
  else if(ds.math&&el.tagName==="BUTTON"){const s=S.math[ds.math]||(S.math[ds.math]={});s.seen=!s.seen;if(!s.seen)s.done=false;save();render()}
  else if(el.id==="pack"){const have=new Set(S.cards.map(c=>c.w.toLowerCase()));let n=0;
    STARTWORDS.forEach(([w,m])=>{if(!have.has(w.toLowerCase())){S.cards.push({id:uid(),w,m,box:0,due:today()});have.add(w.toLowerCase());n++}});
    S.pack=true;save();render();toast(n?n+" ord tillagda – "+(S.settings.perDay||20)+" nya per dag":"Alla ord finns redan")}
  else if(el.id==="drillStart"){drill={qs:Array.from({length:10},()=>pickr(GEN)()),i:0,start:Date.now(),res:[]};render();focusDrill()}
  else if(ds.topic){drill={qs:Array.from({length:10},()=>pickr(TOPICS[ds.topic])()),i:0,start:Date.now(),res:[],topic:ds.topic};render();focusDrill()}
  else if(el.id==="drillOk"){const inp=document.getElementById("drillIn");const raw=inp.value.trim();if(!raw){inp.focus();return}
    const v=parseFloat(raw.replace(",",".").replace("−","-")),q=drill.qs[drill.i];
    drill.res.push({q:q.q,a:q.a,g:raw,ok:Math.abs(v-q.a)<0.011});drill.i++;
    if(drill.i>=drill.qs.length){drill.sec=Math.round((Date.now()-drill.start)/1000);const sc=drill.res.filter(r=>r.ok).length;
      S.drill.rounds++;if(!drill.topic){const b=S.drill.best;if(!b||sc>b.score||(sc===b.score&&drill.sec<b.sec))S.drill.best={score:sc,sec:drill.sec}}save()}
    render();focusDrill()}
  else if(el.id==="drillQuit"){drill=null;render()}
  else if(el.id==="bkDl"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="hp-plugg-"+today()+".json";document.body.appendChild(a);a.click();a.remove();toast("Säkerhetskopian är nedladdad")}
  else if(el.id==="bk"){showBackup=!showBackup;render()}
  else if(el.id==="bkIn"){try{const o=JSON.parse(document.getElementById("bkt").value);if(!o||!Array.isArray(o.sessions))throw 0;S=Object.assign(defaults(),o);save();showBackup=false;render();toast("Kopian är inläst")}catch(_){toast("Rutan innehåller ingen giltig kopia")}}
});
document.getElementById("app").addEventListener("change",e=>{
  const el=e.target,ds=el.dataset;
  if(ds.res!==undefined){S.results[+ds.res][ds.f]=el.value;save();if(ds.f==="kv"||ds.f==="ve"){const c=document.querySelector(".chart");if(c)c.outerHTML=chart()}}
  else if(ds.first!==undefined){S.first[ds.first]=el.checked;save()}
  else if(ds.math&&el.type==="checkbox"){(S.math[ds.math]||(S.math[ds.math]={})).done=el.checked;save();render()}
  else if(el.id==="exam"){S.settings.exam=el.value;save()}
  else if(el.id==="bkFile"&&el.files[0]){el.files[0].text().then(t=>{const o=JSON.parse(t);if(!o||!Array.isArray(o.sessions))throw 0;S=Object.assign(defaults(),o);fix();save();render();toast("Kopian är inläst")}).catch(()=>toast("Filen är ingen giltig kopia"))}
  else if(ds.ex){const o=S.exams[ds.ex]||(S.exams[ds.ex]={});o[ds.f]=el.type==="checkbox"?el.checked:el.value;save()}
  else if(el.id==="perDay"){S.settings.perDay=+el.value;save();render()}
  else if(el.id==="snd"){S.settings.sound=el.checked;save();if(el.checked){ensureAudio();beep()}}
});
document.getElementById("app").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.target.id==="cw"||e.target.id==="cm")){document.getElementById("cAdd").click()}
  else if(e.key==="Enter"&&e.target.id==="drillIn"){document.getElementById("drillOk").click()}
});
window.addEventListener("hashchange",()=>{const t=location.hash.replace("#","");if(TABS.includes(t)&&t!==tab){tab=t;render()}});
render();
</script>
</body>
</html>
